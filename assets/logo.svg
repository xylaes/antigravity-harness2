<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="50%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#FBBC05" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="50%" stop-color="#9C27B0" />
      <stop offset="100%" stop-color="#4285F4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dual Recursion Loop / Harness Rings (10% padding boundary: 26 to 230) -->
  <g filter="url(#glow)">
    <!-- Outer Invariant Ring (Propose-Probe-Compose Cycle) -->
    <circle cx="128" cy="128" r="92" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.85" />
    
    <!-- Inner Harnessing Loop (Experience Library Memory) -->
    <ellipse cx="128" cy="128" rx="72" ry="46" fill="none" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" transform="rotate(-25 128 128)" />
    <ellipse cx="128" cy="128" rx="72" ry="46" fill="none" stroke="url(#primaryGrad)" stroke-width="7" stroke-linecap="round" transform="rotate(35 128 128)" opacity="0.75" />

    <!-- Center Emblem: H² Monogram -->
    <circle cx="128" cy="128" r="38" fill="#1E1E2E" stroke="#4285F4" stroke-width="3.5" />
    
    <!-- Letter H -->
    <path d="M 112 110 L 112 146 M 112 128 L 132 128 M 132 110 L 132 146" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Superscript 2 -->
    <path d="M 139 113 C 139 109, 146 109, 146 113 C 146 116, 139 119, 139 122 L 147 122" fill="none" stroke="#34A853" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
